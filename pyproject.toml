[build-system]
requires = [
    "scikit-build-core>=0.9",
    "pybind11>=2.12",
    "cmake>=3.18",
    "ninja"
]
build-backend = "scikit_build_core.build"

[project]
name = "mlite-lib"
version = "0.1.0"
description = "ML library written in C++ and Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

authors = [
    { name = "Ugoke" }
]

dependencies = [
    "numpy>=1.24"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
]

keywords = [
    "machine-learning",
    "linear-algebra",
    "cpp",
    "pybind11",
    "python"
]

[project.urls]
Homepage = "https://github.com/Ugoke/mlite"
Repository = "https://github.com/Ugoke/mlite"
Documentation = "https://github.com/Ugoke/mlite#readme"

[project.optional-dependencies]

dev = [
    "pytest",
    "ruff",
    "black",
]

[tool.scikit-build]
wheel.packages = ["python/mlite"]

build-dir = "build/{wheel_tag}"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
test-requires = ["pytest"]
test-command = "pytest {project}/tests -q"

[tool.pytest.ini_options]

testpaths = [
    "tests"
]
